apis:
- aid: engrail-therapeutics:content
  name: Engrail Therapeutics Site Content API
  description: 'The public, anonymously-readable content API exposed by engrail.com at /wp-json/wp/v2.
    Sixteen read operations over posts, pages, media, categories, tags, comments, and the site''s own
    type/taxonomy/status vocabulary, plus site search. Derived mechanically from the provider''s own
    WordPress REST route-discovery document — Engrail publishes no hand-authored OpenAPI.'
  humanURL: https://www.engrail.com/investors-media/
  baseURL: https://www.engrail.com/wp-json
