- aid: engrail-therapeutics:mcp
  name: Engrail Therapeutics MCP Servers
  description: 'Two live Model Context Protocol servers registered under the `mcp` REST namespace on
    engrail.com, fronted by RFC 8414 and RFC 9728 OAuth discovery documents at the apex. Both are
    OAuth-protected — anonymous tools/list returns HTTP 401 — so the live tool manifest is not
    readable and no tool list is recorded.'
  humanURL: https://www.engrail.com/
  baseURL: https://www.engrail.com/wp-json/mcp/mcp-oauth-server
