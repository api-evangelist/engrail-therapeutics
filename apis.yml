aid: engrail-therapeutics
name: Engrail Therapeutics
description: 'Engrail Therapeutics is a clinical-stage precision-neuroscience pharmaceutical company
  founded in 2019 and headquartered in San Diego, California. It applies precision chemistry and
  pharmacology to scientifically validated mechanisms of action, developing targeted small-molecule
  therapies for neuropsychiatric and neurodevelopmental diseases with significant unmet need —
  including generalized anxiety disorder, major depressive disorder characterized by anhedonia,
  post-traumatic stress disorder and rare neurodegenerative conditions. Its lead program, ENX-102, is
  a highly selective GABA-A alpha-2,3,5 positive allosteric modulator in Phase 2 (the ENCALM trial)
  for generalized anxiety disorder; ENX-104 is in clinical development for anhedonic depression. The
  company closed an oversubscribed $157M Series B in March 2024 co-led by F-Prime Capital, Forbion
  and Norwest Venture Partners, bringing total capital raised since inception past $220M. Engrail
  publishes no product or developer API; the machine-readable surfaces catalogued here are the public
  read-only content API and the OAuth-protected Model Context Protocol servers exposed by its
  corporate website.'
