    message: Human-readable message.
    data.status: HTTP status, repeated inside the body.
    data.params: Per-parameter validation messages (validation errors only).
    data.details: Per-parameter structured detail with its own nested code/message.
  see: errors/engrail-therapeutics-problem-types.yml
