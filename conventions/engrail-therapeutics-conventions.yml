observed_from: https://www.engrail.com/wp-json/wp/v2/posts
note: >-
  Engrail publishes no API documentation of any kind. Every convention below was observed directly
  against the live host on 2026-08-01 or read out of the provider's own route-discovery document —
  nothing is assumed from the WordPress project's general documentation.
authentication:
  style: none-for-read
  detail: >-
    Public content collections are anonymously readable. Writes and non-public collections use HTTP
    Basic with a WordPress Application Password; the MCP surface uses OAuth 2.1 bearer tokens.
  see: authentication/engrail-therapeutics-authentication.yml
idempotency:
  supported: false
  detail: >-
    No idempotency key header, parameter, or retry contract is advertised anywhere on the surface.
    The public operations are all safe GETs, so idempotency is a property of HTTP method only.
  header: null
pagination:
  style: page-number
  request_params:
  - name: page
    default: 1
    minimum: 1
  - name: per_page
    default: 10
    minimum: 1
    maximum: 100
  - name: offset
    note: Accepted on collection endpoints as an alternative cursor into the result set.
  response_headers:
  - name: X-WP-Total
    description: Total number of items in the collection.
  - name: X-WP-TotalPages
    description: Total number of pages at the current per_page.
  - name: Link
    description: RFC 8288 link header carrying rel="next" and rel="prev".
  observed_example: 'GET /wp-json/wp/v2/posts?per_page=1 -> X-WP-Total: 10, X-WP-TotalPages: 10, Link rel="next"'
filtering_and_sorting:
  search_param: search
  ordering_params:
  - orderby
  - order
  include_exclude:
  - include
  - exclude
  slug_lookup: slug
  date_windows:
  - after
  - before
  - modified_after
  - modified_before
field_selection:
  sparse_fields:
    supported: true
    param: _fields
    detail: Comma-separated whitelist of response properties.
  expansion:
    supported: true
    param: _embed
    detail: Inlines linked resources (author, featured media, terms) under _embedded.
  context:
    param: context
    values: [view, embed, edit]
    default: view
    detail: Controls which field set is returned; `edit` requires authentication.
metadata:
  supported: partial
  detail: Registered post meta is exposed on a `meta` object where the site opts fields in.
request_tracing:
